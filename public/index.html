<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-op Minesweeper</title>
<style>
  :root { --bg:#1e2230; --panel:#2a3045; --text:#eef0f6; --cell:#c0c7d6; --open:#e9ecf3; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  h1 { margin:8px 0 16px; font-size:1.4rem; }
  .card { background:var(--panel); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px; width:min(340px,100%); }
  input, button { font:inherit; padding:10px 12px; border-radius:8px; border:0; }
  input { background:#fff; color:#111; }
  #code { text-transform:uppercase; letter-spacing:.2em; text-align:center; }
  button { background:#4f7cff; color:#fff; cursor:pointer; font-weight:600; }
  button.alt { background:#3b4363; }
  button:focus-visible, input:focus-visible { outline:3px solid #ffd166; outline-offset:2px; }
  #err { color:#ff8a8a; min-height:1.2em; margin:0; }
  #game { display:none; flex-direction:row; align-items:flex-start; justify-content:center; gap:16px; max-width:100%; }
  #main { display:flex; flex-direction:column; align-items:center; gap:12px; min-width:0; max-width:100%; }
  .bar { display:flex; gap:8px 18px; flex-wrap:wrap; justify-content:center; align-items:center;
         background:var(--panel); padding:10px 16px; border-radius:10px; }
  .pl { font-weight:600; }
  #wrap { max-width:100%; overflow-x:auto; padding:4px; }
  #grid { display:grid; grid-template-columns:repeat(30, 26px); gap:1px; background:#8d95aa; border:3px solid #8d95aa;
          user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .c { width:26px; height:26px; background:var(--cell); display:flex; align-items:center; justify-content:center;
       font:700 15px/1 system-ui; cursor:pointer; }
  .c.o { background:var(--open); cursor:default; }
  .c.x { background:#ff6b6b; }
  #msg { font-size:1.2rem; font-weight:700; min-height:1.5em; text-align:center; }
  #over { display:none; position:fixed; inset:0; background:rgba(20,24,38,.55); align-items:center; justify-content:center; z-index:10; }
  #over .box { background:var(--panel); border-radius:14px; padding:24px 28px; display:flex; flex-direction:column; gap:12px;
               text-align:center; min-width:min(300px,90vw); box-shadow:0 8px 30px rgba(0,0,0,.45); }
  #omsg { font-size:1.3rem; font-weight:700; }
  .lb { background:var(--panel); border-radius:10px; padding:12px 18px; width:220px; flex:none; }
  .lb h2 { margin:0 0 8px; font-size:1.05rem; }
  .lb ol { margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:8px; }
  .lb li span { display:block; opacity:.75; font-size:.85rem; }
  .lb p { margin:0; opacity:.75; }
  @media (max-width: 1100px) {
    #game { flex-direction:column-reverse; align-items:center; }
    .lb { width:min(560px,100%); }
  }
</style>
</head>
<body>
<h1>Co-op Minesweeper</h1>

<div id="lobby" class="card">
  <input id="name" placeholder="Your name" maxlength="12" autocomplete="off">
  <button id="create">Create room</button>
  <input id="code" placeholder="CODE" maxlength="4" autocomplete="off">
  <button id="join" class="alt">Join room</button>
  <p id="err"></p>
</div>

<div id="game">
  <div class="lb">
    <h2>Fastest clears</h2>
    <ol id="lbl"></ol>
    <p id="lbe">No clears yet. Be the first!</p>
  </div>
  <div id="main">
  <div class="bar">
    <span>Room <b id="rc"></b></span>
    <span>Mines left <b id="left"></b></span>
    <span>Time <b id="time">0</b>s</span>
    <span id="players"></span>
    <button id="mode" class="alt">Click: reveal</button>
  </div>
  <div id="msg"></div>
  <div id="wrap"><div id="grid"></div></div>
  </div>
</div>

<div id="over">
  <div class="box">
    <div id="omsg"></div>
    <button id="again">Play again</button>
    <button id="peek" class="alt">View board</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const socket = io();
const pid = sessionStorage.getItem('pid') ||
  (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
sessionStorage.setItem('pid', pid);
const NUM = ['', '#1d4ed8', '#15803d', '#dc2626', '#1e3a8a', '#9a3412', '#0e7490', '#111', '#6b7280'];
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let st = null, flagMode = false, cur = {}, recvAt = 0, last = -1;

const grid = $('grid');
const cells = [];
for (let i = 0; i < 480; i++) {
  const d = document.createElement('div');
  d.className = 'c';
  d.dataset.i = i;
  cells.push(d);
  grid.appendChild(d);
}

const ack = (res) => { $('err').textContent = (res && res.error) || ''; };
$('create').onclick = () => socket.emit('create', { name: $('name').value, pid }, ack);
$('join').onclick = () => socket.emit('join', { code: $('code').value, name: $('name').value, pid }, ack);
$('again').onclick = () => socket.emit('restart');
let peek = false; // "View board" hides the end box until the next game
$('peek').onclick = () => { peek = true; $('over').style.display = 'none'; };
const fmt = (ms) => Math.round(ms / 1000) + 's';
$('mode').onclick = () => {
  flagMode = !flagMode;
  $('mode').textContent = 'Click: ' + (flagMode ? 'flag' : 'reveal');
};

const idx = (e) => { const t = e.target.closest('.c'); return t ? +t.dataset.i : -1; };

// Left click reveals (or chords on a number). Right click flags. Middle click chords.
// The "Click: flag" toggle gives touch screens a way to flag.
grid.addEventListener('click', (e) => {
  const i = idx(e);
  if (i < 0 || !st) return;
  socket.emit(flagMode && st.cells[i] < 0 ? 'flag' : 'reveal', i);
});
grid.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const i = idx(e);
  if (i >= 0) socket.emit('flag', i);
});
grid.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
grid.addEventListener('auxclick', (e) => {
  if (e.button !== 1) return;
  e.preventDefault();
  const i = idx(e);
  if (i >= 0) socket.emit('reveal', i);
});
grid.addEventListener('mouseover', (e) => {
  const i = idx(e);
  if (i >= 0 && i !== last) { last = i; socket.emit('cursor', i); }
});

function drawCursors() {
  cells.forEach((d) => (d.style.boxShadow = ''));
  for (const [id, i] of Object.entries(cur)) {
    const p = st.players.find((p) => p.id === id);
    if (p && id !== pid) cells[i].style.boxShadow = `inset 0 0 0 3px ${p.color}`;
  }
}

function render() {
  $('lobby').style.display = 'none';
  $('game').style.display = 'flex';
  $('rc').textContent = st.code;
  $('left').textContent = st.left;
  const me = st.players.find((p) => p.id === pid);
  if (me) sessionStorage.setItem('room', JSON.stringify({ code: st.code, name: me.name }));
  $('players').innerHTML = st.players
    .map((p) => `<span class="pl" style="color:${p.color}">● ${esc(p.name)}${p.id === pid ? ' (you)' : ''}</span>`)
    .join(' &nbsp; ');

  st.cells.forEach((v, i) => {
    const d = cells[i], isNum = v >= 0 && v <= 8;
    d.className = 'c' + (isNum ? ' o' : v === 10 ? ' o x' : '');
    d.style.color = v > 0 && v <= 8 ? NUM[v] : '';
    d.textContent = v === -2 ? '🚩' : v > 0 && v <= 8 ? v : v === 9 ? '💣' : v === 10 ? '💥' : v === 11 ? '❌' : '';
  });

  const over = st.status === 'won' || st.status === 'lost';
  const text =
    st.status === 'won' ? `Cleared in ${fmt(st.elapsed)}. Nice teamwork!`
    : st.status === 'lost' ? `${st.by} hit a mine.` : '';
  if (!over) peek = false;
  $('msg').textContent = text;
  $('omsg').textContent = text;
  $('over').style.display = over && !peek ? 'flex' : 'none';
  recvAt = Date.now();
  drawCursors();
  tick();
}

function tick() {
  if (!st) return;
  const ms = st.elapsed + (st.status === 'playing' ? Date.now() - recvAt : 0);
  $('time').textContent = Math.floor(ms / 1000);
}
setInterval(tick, 250);

socket.on('state', (s) => { st = s; render(); });
socket.on('board', (rows) => {
  $('lbe').style.display = rows.length ? 'none' : '';
  $('lbl').innerHTML = rows.map((r) =>
    `<li><b>${fmt(r.ms)}</b><span>${new Date(r.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</span><span>${esc(r.players.join(', '))}</span></li>`
  ).join('');
});
socket.on('cursor', ({ id, i }) => { cur[id] = i; if (st) drawCursors(); });
// Fires on first load and after every reconnect: slip back into the saved room and seat.
socket.on('connect', () => {
  const saved = JSON.parse(sessionStorage.getItem('room') || 'null');
  if (!saved) return;
  socket.emit('join', { code: saved.code, name: saved.name, pid }, (res) => {
    if (!res || !res.error) return;
    sessionStorage.removeItem('room');
    st = null;
    $('game').style.display = 'none';
    $('lobby').style.display = '';
    $('err').textContent = res.error;
  });
});
socket.on('disconnect', () => {
  $('msg').textContent = 'Connection lost. Reconnecting...';
});
</script>
</body>
</html>
